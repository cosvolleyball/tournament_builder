# Add to .github/workflows/supabase-activity-check.yml
# Sends a small, read-only database request three times daily.
name: Supabase Activity Check

on:
  schedule:
    # UTC: 05:17, 13:17 and 21:17 every day.
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase tournament database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo 'Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY repository variable.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header 'Accept: application/json' \
            --output /dev/null \
            --write-out 'Supabase request: HTTP %{http_code}\n' \
            "${SUPABASE_URL%/}/rest/v1/tournaments?select=id&limit=1"
