name: QA anonymous read-only security smoke test

on:
  push:
    branches:
      - qa/pagination-regression-2026-11

permissions:
  contents: read

jobs:
  anon-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Verify public API reads and draft visibility without writing data
        env:
          SB_URL: ${{ vars.VITE_SUPABASE_URL }}
          SB_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createClient} from '@supabase/supabase-js';
          if(!process.env.SB_URL||!process.env.SB_KEY)throw Error('Missing Supabase public project variables');
          const db=createClient(process.env.SB_URL,process.env.SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
          const tables=['tournaments','competition_divisions','teams','pools','pool_teams','matches','set_scores','playoff_brackets','playoff_round_rules','playoff_match_links','playoff_loser_links'];
          for(const table of tables){
            const {error}=await db.from(table).select('*').limit(1);
            if(error)throw Error(table+': '+error.message);
          }
          const {data:drafts,error:draftErr}=await db.from('tournaments').select('id,status').eq('status','draft').limit(1);
          if(draftErr)throw Error(draftErr.message);
          if(drafts?.length)throw Error('SECURITY FAILURE: anonymous user can read draft tournament');
          const {data:visible,error:visibleErr}=await db.from('tournaments').select('id,status').limit(500);
          if(visibleErr)throw Error(visibleErr.message);
          if(visible?.some(x=>x.status==='draft'))throw Error('SECURITY FAILURE: draft shown in public tournament list');
          const {data:matches,error:matchErr}=await db.from('matches').select('id,tournament_id').limit(20);
          if(matchErr)throw Error(matchErr.message);
          for(const tid of [...new Set((matches??[]).map(x=>x.tournament_id))]){
            const {data:parent,error}=await db.from('tournaments').select('id,status').eq('id',tid).maybeSingle();
            if(error)throw Error(error.message);
            if(!parent || parent.status==='draft')throw Error('SECURITY FAILURE: a public match belongs to a hidden draft');
          }
          console.log(JSON.stringify({result:'PASS',checked_table_reads:tables.length,draft_rows_exposed:0,public_tournaments_sampled:visible?.length??0,public_matches_sampled:matches?.length??0}));
          NODE
